<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>
  <style>
    .grid { stroke: #e5e7eb; stroke-width: 1.5; }
    .axis { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .label { font-family: 'Fira Code', monospace; font-size: 14px; fill: #6b7280; text-anchor: middle; dominant-baseline: middle; }
    .plot { stroke: #B01A00; stroke-width: 3; fill: none; stroke-linecap: round; }
    .point { fill: #B01A00; stroke: none; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="440" height="720" fill="white"/>

  <!-- Translate to plot area with margin (40px) -->
  <!-- Origin x = 200, y = 280 (from top) -->
  <g transform="translate(40, 40)">
    
    <!-- Grid -->
    <!-- Vertical lines x=-4 to 5. 40px step -->
    <!-- i goes 0 to 9. x pos = i*40 -->
    <line x1="0" y1="0" x2="0" y2="640" class="grid"/>
    <line x1="40" y1="0" x2="40" y2="640" class="grid"/>
    <line x1="80" y1="0" x2="80" y2="640" class="grid"/>
    <line x1="120" y1="0" x2="120" y2="640" class="grid"/> <!-- x=-1 -->
    <line x1="160" y1="0" x2="160" y2="640" class="grid"/> <!-- x=0 (axis) -->
    <line x1="200" y1="0" x2="200" y2="640" class="grid"/>
    <line x1="240" y1="0" x2="240" y2="640" class="grid"/>
    <line x1="280" y1="0" x2="280" y2="640" class="grid"/>
    <line x1="320" y1="0" x2="320" y2="640" class="grid"/>
    <line x1="360" y1="0" x2="360" y2="640" class="grid"/> <!-- x=5 -->

    <!-- Horizontal lines y=-10 to 6. 40px step -->
    <!-- j goes 0 to 16. y pos = j*40 -->
    <line x1="0" y1="0" x2="360" y2="0" class="grid"/> <!-- y=6 -->
    <line x1="0" y1="40" x2="360" y2="40" class="grid"/>
    <line x1="0" y1="80" x2="360" y2="80" class="grid"/>
    <line x1="0" y1="120" x2="360" y2="120" class="grid"/>
    <line x1="0" y1="160" x2="360" y2="160" class="grid"/>
    <line x1="0" y1="200" x2="360" y2="200" class="grid"/>
    <line x1="0" y1="240" x2="360" y2="240" class="grid"/> <!-- y=0 (axis) -->
    <line x1="0" y1="280" x2="360" y2="280" class="grid"/>
    <line x1="0" y1="320" x2="360" y2="320" class="grid"/>
    <line x1="0" y1="360" x2="360" y2="360" class="grid"/>
    <line x1="0" y1="400" x2="360" y2="400" class="grid"/>
    <line x1="0" y1="440" x2="360" y2="440" class="grid"/>
    <line x1="0" y1="480" x2="360" y2="480" class="grid"/>
    <line x1="0" y1="520" x2="360" y2="520" class="grid"/>
    <line x1="0" y1="560" x2="360" y2="560" class="grid"/>
    <line x1="0" y1="600" x2="360" y2="600" class="grid"/>
    <line x1="0" y1="640" x2="360" y2="640" class="grid"/> <!-- y=-10 -->

    <!-- Axes -->
    <!-- X Axis (y=0 -> pixel 240) -->
    <line x1="0" y1="240" x2="375" y2="240" class="axis"/>
    
    <!-- Y Axis (x=0 -> pixel 160) -->
    <line x1="160" y1="640" x2="160" y2="-15" class="axis"/>

    <!-- Labels -->
    <!-- X Labels -->
    <text x="40" y="265" class="label">-3</text>
    <text x="80" y="265" class="label">-2</text>
    <text x="120" y="265" class="label">-1</text>
    <!-- 0 skipped -->
    <text x="200" y="265" class="label">1</text>
    <text x="240" y="265" class="label">2</text>
    <text x="280" y="265" class="label">3</text>
    <text x="320" y="265" class="label">4</text>
    
    <!-- Y Labels (every 2 units to match typst style if desired, or every 1) -->
    <!-- Let's do every 2 -->
    <text x="135" y="640" class="label">-10</text>
    <text x="135" y="560" class="label">-8</text>
    <text x="135" y="480" class="label">-6</text>
    <text x="135" y="400" class="label">-4</text>
    <text x="135" y="320" class="label">-2</text>
    <!-- 0 skipped -->
    <text x="135" y="160" class="label">2</text>
    <text x="135" y="80" class="label">4</text>
    <text x="135" y="0" class="label">6</text>

    <!-- Function y = 2x - 3 -->
    <!-- Domain [-3, 4] -->
    <!-- Point 1: (-3, -9). x = 160 + (-3)*40 = 40. y = 240 - (-9)*40 = 240 + 360 = 600. -->
    <!-- Point 2: (4, 5). x = 160 + 4*40 = 320. y = 240 - 5*40 = 40. -->
    <line x1="40" y1="600" x2="320" y2="40" class="plot"/>

    <!-- Endpoints -->
    <circle cx="40" cy="600" r="5" class="point"/>
    <circle cx="320" cy="40" r="5" class="point"/>

  </g>
</svg>
